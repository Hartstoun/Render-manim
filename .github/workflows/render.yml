name: Render Manim

on:
  workflow_dispatch:
    inputs:
      job_id:         { required: true,  type: string }
      title:          { required: true,  type: string }
      scene_code:     { required: true,  type: string }
      audio_url:      { required: false, type: string }
      audio_name:     { required: false, type: string }
      notion_page_id: { required: false, type: string }
      notion_prop:    { required: false, type: string }
      attempt:        { required: false, type: string, default: '1' }

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: manimcommunity/manim:v0.21.0
      options: --user root

    steps:
      - name: Зависимости
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl file ffmpeg
          which curl file ffmpeg ffprobe python3 || true

      - name: Записать сцену
        env:
          SCENE_CODE: ${{ inputs.scene_code }}
        run: |
          mkdir -p /tmp/work
          printf '%s' "$SCENE_CODE" > /tmp/work/scene.py
          cd /tmp/work
          echo "--- сцена ждёт такие аудиофайлы ---"
          grep -o 'add_sound([^)]*)' scene.py || echo "add_sound в коде нет"

      - name: Скачать озвучку
        if: inputs.audio_url != ''
        working-directory: /tmp/work
        env:
          AUDIO_URL:  ${{ inputs.audio_url }}
          AUDIO_NAME: ${{ inputs.audio_name }}
        run: |
          set +e
          curl -sS --fail-with-body -L -o "$AUDIO_NAME" "$AUDIO_URL" > dl.log 2>&1
          CODE=$?
          set -e
          cat dl.log
          if [ "$CODE" -ne 0 ]; then
            echo "::error::Не удалось скачать аудио"
            { echo "СКАЧИВАНИЕ АУДИО НЕ УДАЛОСЬ"; tail -c 1000 dl.log; } > error.txt
            exit 1
          fi

          echo "Размер: $(stat -c%s "$AUDIO_NAME") байт"
          file "$AUDIO_NAME"

          if file "$AUDIO_NAME" | grep -qi 'html\|text'; then
            echo "::error::Вместо аудио пришла веб-страница"
            { echo "DRIVE ВЕРНУЛ HTML ВМЕСТО АУДИО:"; head -c 800 "$AUDIO_NAME"; } > error.txt
            exit 1
          fi

          if ! ffprobe -v error -show_entries format=duration -of csv=p=0 "$AUDIO_NAME"; then
            echo "::error::ffprobe не смог разобрать файл"
            echo "АУДИОФАЙЛ НЕ ЧИТАЕТСЯ ffprobe" > error.txt
            exit 1
          fi
          echo "Аудио читается"

      - name: Рендер
        working-directory: /tmp/work
        run: |
          set +e
          manim -ql --format=mp4 -a scene.py > render.log 2>&1
          CODE=$?
          set -e
          cat render.log
          if [ "$CODE" -ne 0 ]; then
            echo "::error::Рендер упал с кодом $CODE"
            tail -c 1800 render.log > error.txt
            exit "$CODE"
          fi

      - name: Найти видео
        working-directory: /tmp/work
        run: |
          FILE=$(find media/videos -name '*.mp4' -not -path '*partial_movie_files*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "::error::Готовое видео не найдено"
            { echo "РЕНДЕР ПРОШЁЛ, НО MP4 НЕ НАЙДЕН. Что есть в media:"; find media -name '*.mp4'; } > error.txt
            exit 1
          fi
          echo "VIDEO=$FILE" >> $GITHUB_ENV
          echo "Видео: $FILE ($(du -h "$FILE" | cut -f1))"
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 "$FILE" || true

      - name: Загрузить на Drive
        id: upload
        working-directory: /tmp/work
        env:
          CLIENT_ID:     ${{ secrets.GDRIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          FOLDER_ID:     ${{ secrets.GDRIVE_FOLDER_ID }}
          TITLE:         ${{ inputs.title }}
        run: |
          set -e

          # 1. Обновляем access token
          curl -sS -X POST https://oauth2.googleapis.com/token \
            -d "client_id=$CLIENT_ID" \
            -d "client_secret=$CLIENT_SECRET" \
            -d "refresh_token=$REFRESH_TOKEN" \
            -d "grant_type=refresh_token" > token.json

          TOKEN=$(python3 -c "import json;print(json.load(open('token.json')).get('access_token',''))")
          if [ -z "$TOKEN" ]; then
            echo "::error::Не удалось получить access token"
            { echo "OAUTH НЕ СРАБОТАЛ:"; python3 -c "import json;d=json.load(open('token.json'));print(d.get('error'),d.get('error_description'))"; } > error.txt
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "Токен получен"

          # 2. Открываем resumable-сессию
          python3 -c "
          import json,os
          print(json.dumps({'name': os.environ['TITLE'] + '.mp4', 'parents': [os.environ['FOLDER_ID']]}))
          " > meta.json

          curl -sS -X POST \
            "https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&supportsAllDrives=true" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json; charset=UTF-8" \
            --data-binary @meta.json \
            -D init_headers.txt -o init_body.txt

          LOCATION=$(grep -i '^location:' init_headers.txt | sed 's/^[Ll]ocation: *//' | tr -d '\r\n')
          if [ -z "$LOCATION" ]; then
            echo "::error::Drive не открыл сессию загрузки"
            { echo "DRIVE ОТКАЗАЛ:"; head -c 800 init_body.txt; } > error.txt
            exit 1
          fi

          # 3. Заливаем файл
          curl -sS -X PUT "$LOCATION" \
            -H "Content-Type: video/mp4" \
            --upload-file "$VIDEO" \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 900 > upload.json

          FILE_ID=$(python3 -c "import json;print(json.load(open('upload.json')).get('id',''))")
          if [ -z "$FILE_ID" ]; then
            echo "::error::Загрузка не вернула id файла"
            { echo "ЗАГРУЗКА НА DRIVE НЕ УДАЛАСЬ:"; head -c 800 upload.json; } > error.txt
            exit 1
          fi

          # 4. Открываем доступ по ссылке
          curl -sS -X POST \
            "https://www.googleapis.com/drive/v3/files/$FILE_ID/permissions" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"role":"reader","type":"anyone"}' > perm.json
          echo "Доступ: $(head -c 200 perm.json)"

          echo "FILE_ID=$FILE_ID" >> $GITHUB_ENV
          echo "VIDEO_URL=https://drive.google.com/uc?export=download&id=$FILE_ID" >> $GITHUB_ENV
          echo "Загружено: https://drive.google.com/file/d/$FILE_ID/view"

      - name: Колбэк — успех
        id: cb_ok
        env:
          JOB_ID:  ${{ inputs.job_id }}
          TITLE:   ${{ inputs.title }}
          NPAGE:   ${{ inputs.notion_page_id }}
          NPROP:   ${{ inputs.notion_prop }}
          ATTEMPT: ${{ inputs.attempt }}
        run: |
          curl -sS --fail-with-body -X POST "${{ secrets.N8N_WEBHOOK_URL }}" \
            --retry 3 --retry-delay 10 --retry-all-errors \
            -F "status=ok" \
            -F "job_id=$JOB_ID" \
            -F "title=$TITLE" \
            -F "notion_page_id=$NPAGE" \
            -F "notion_prop=$NPROP" \
            -F "attempt=$ATTEMPT" \
            -F "video_url=$VIDEO_URL" \
            -F "file_id=$FILE_ID"

      - name: Колбэк — провал
        if: failure() && steps.cb_ok.outcome != 'failure'
        working-directory: /tmp/work
        env:
          JOB_ID:  ${{ inputs.job_id }}
          TITLE:   ${{ inputs.title }}
          NPAGE:   ${{ inputs.notion_page_id }}
          NPROP:   ${{ inputs.notion_prop }}
          ATTEMPT: ${{ inputs.attempt }}
        run: |
          [ -f error.txt ] || echo "Падение на раннем шаге — смотри лог запуска" > error.txt
          echo "--- отправляем такой traceback ---"
          cat error.txt
          curl -sS -X POST "${{ secrets.N8N_WEBHOOK_URL }}" \
            -F "status=failed" \
            -F "job_id=$JOB_ID" \
            -F "title=$TITLE" \
            -F "notion_page_id=$NPAGE" \
            -F "notion_prop=$NPROP" \
            -F "attempt=$ATTEMPT" \
            -F "log_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -F "traceback=<error.txt"