name: Render Manim

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
      scene_code:
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: manimcommunity/manim:latest
      options: --user root

    steps:
      - name: Записать сцену
        env:
          SCENE_CODE: ${{ inputs.scene_code }}
        run: |
          mkdir -p /tmp/work
          printf '%s' "$SCENE_CODE" > /tmp/work/scene.py
          echo "--- полученный код ---"
          cat /tmp/work/scene.py

      - name: Рендер
        working-directory: /tmp/work
        run: manim -ql --format=mp4 scene.py Lesson

      - name: Отправить в n8n
        run: |
          FILE=$(find /tmp/work/media -name '*.mp4' | head -n 1)
          echo "Файл: $FILE ($(du -h "$FILE" | cut -f1))"
          curl -sS --fail-with-body -X POST "${{ secrets.N8N_WEBHOOK_URL }}" \
            -F "job_id=${{ inputs.job_id }}" \
            -F "video=@${FILE};type=video/mp4"